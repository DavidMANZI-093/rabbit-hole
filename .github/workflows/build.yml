# Builds release binaries for the Linux targets that `cargo check` passes:
# x86_64 (native) and aarch64 (cross-compiled via `cross`, Docker-based).
# Windows/macOS rows below are untested against the current dependency set.
#
# Target notes:
#   linux-x86_64       — native runner, glibc, standard GNU toolchain
#   linux-aarch64      — cross-compiled on ubuntu via `cross` (Docker-based);
#                        needs a cross C toolchain + cmake in the image for
#                        aws-lc-sys/ring (both vendors support linux-aarch64)
#   windows-x86_64     — native Windows runner, MSVC toolchain
#   macos-x86_64       — native macOS Intel runner
#   macos-aarch64      — native macOS Apple Silicon runner
#
# reqwest uses rustls (aws-lc-rs provider + OS verifier), which builds fine on
# all five targets above. musl is deliberately excluded (unverified against the
# current rustls/aws-lc-sys C build, not a native-tls limitation).

name: build

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }} @ ${{ github.ref_name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: false
            ext: ""

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: true
            ext: ""

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            ext: ".exe"

          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
            ext: ""

          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            ext: ""

    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: install cross (aarch64-linux only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: build
        env:
          RH_EDGE_BASE: ${{ secrets.RH_EDGE_BASE }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --profile dist --locked --target ${{ matrix.target }}
          else
            cargo build --profile dist --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: rename binary for upload
        shell: bash
        run: |
          src="target/${{ matrix.target }}/dist/rh${{ matrix.ext }}"
          dst="rh${{ matrix.ext }}"
          mv "$src" "$dst"

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rh-${{ github.ref_name }}-${{ matrix.target }}
          path: rh${{ matrix.ext }}
          retention-days: 90
          if-no-files-found: error

  release:
    name: release (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist-artifacts

      - name: package zips
        shell: pwsh
        run: |
          $dest = Join-Path (Get-Location) "dist-zips"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem -Path dist-artifacts -Directory | ForEach-Object {
            Push-Location $_.FullName
            try {
              $bin = Get-ChildItem -File | Select-Object -First 1
              Compress-Archive -Path $bin.Name -DestinationPath (Join-Path $dest "$($_.Name).zip")
            } finally { Pop-Location }
          }

      - name: attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-zips/*.zip
          generate_release_notes: true
