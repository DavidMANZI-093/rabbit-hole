# Runs the full test suite on every push and pull-request.
# No cross-compilation here; tests execute on native Linux only (fast feedback).
# fmt + clippy run as advisory steps: they emit warnings but never fail the job.
name: check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets --locked
        continue-on-error: true

      - name: cargo test
        env:
          RH_EDGE_BASE: ${{ secrets.RH_EDGE_BASE }}
        run: cargo test --locked
