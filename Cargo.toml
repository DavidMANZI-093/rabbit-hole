[package]
name = "rabbit-hole"
version = "0.1.0"
edition = "2024"
description = "Send files and folders as-is, nothing stored in between, hash-verified per block."
license = "MIT"
repository = "https://github.com/DavidMANZI-093/rabbit-hole"

[[bin]]
name = "rh"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "wrap_help"] }
indicatif = "0.18.6"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
walkdir = "2.5.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
