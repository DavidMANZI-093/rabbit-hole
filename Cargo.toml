[package]
name = "rabbit-hole"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rh"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
walkdir = "2.5.0"
